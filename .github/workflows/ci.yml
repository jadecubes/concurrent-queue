name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-tsan:
    name: Tests (ThreadSanitizer, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build-tsan -DENABLE_TSAN=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-tsan -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure -j "$(getconf _NPROCESSORS_ONLN)"

  bench-build:
    name: Benchmarks compile (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build-rel -DCMAKE_BUILD_TYPE=Release -DCQ_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-rel -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Smoke-run benchmarks
        run: ctest --test-dir build-rel --output-on-failure

  lint:
    name: clang-format & clang-tidy
    runs-on: ubuntu-latest
    env:
      # Pinned so a runner-image rollover can't change the formatting
      # contract under us; bump deliberately.
      CLANG_VERSION: 18
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: git ls-files '*.hpp' '*.ipp' '*.cpp' | xargs "clang-format-$CLANG_VERSION" --dry-run --Werror
      - name: clang-tidy
        run: |
          cmake -B build-lint
          git ls-files 'tests/*.cpp' 'bench/*.cpp' |
            xargs -P "$(getconf _NPROCESSORS_ONLN)" -n1 "clang-tidy-$CLANG_VERSION" -p build-lint
