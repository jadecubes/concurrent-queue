name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single parallelism knob: cmake --build and ctest read these from the
  # environment, and the lint job reuses it for xargs -P.
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:
  test-tsan:
    name: Tests (ThreadSanitizer, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build-tsan -DENABLE_TSAN=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-tsan
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure --no-tests=error

  release:
    name: Tests + benchmark smoke-run (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tests stay ON here deliberately. Without this job they only ever run
      # Debug+TSan, which compiles no NDEBUG path, applies no optimiser, and
      # runs the checksum stress test ~12x slower — so it explores a very
      # different, and much narrower, slice of the interleaving space. None of
      # that hides a defect in v1, but the roadmap's lock-free v2 is precisely
      # the code where -O0 and -O3 diverge.
      - name: Configure
        run: cmake -B build-rel -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-rel
      - name: Test and smoke-run benchmarks
        run: ctest --test-dir build-rel --output-on-failure --no-tests=error

  lint:
    name: clang-format & clang-tidy
    runs-on: ubuntu-latest
    env:
      # Pinned so a runner-image rollover can't change the formatting
      # contract under us; bump deliberately.
      CLANG_VERSION: 18
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: git ls-files '*.hpp' '*.ipp' '*.cpp' | xargs -r "clang-format-$CLANG_VERSION" --dry-run --Werror
      - name: clang-tidy
        run: |
          cmake -B build-lint
          git ls-files '*.cpp' |
            xargs -r -P "$CMAKE_BUILD_PARALLEL_LEVEL" -n1 "clang-tidy-$CLANG_VERSION" -p build-lint
